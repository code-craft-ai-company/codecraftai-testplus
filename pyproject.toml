[project]
name = "codecraftai-testplus"
version = "1.2.1"
description = "Code Craft AI - TestPlus Package"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
authors = [{name = "Myron Walker", email = "myron.walker@gmail.com"}]
keywords = [
    "python"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "click>=8.1.3,<9.0.0",
    "debugpy>=1.8.12,<2.0.0",
    "codecraftai-foundations>=1.0.0,<2.0.0",
    "codecraftai-arcli>=1.0.0,<2.0.0",
    "codecraftai-runtime>=1.0.0,<2.0.0",
    "codecraftai-testbase>=1.0.0,<2.0.0",
    "codecraftai-this-app>=1.0.0,<2.0.0",
    "codecraftai-credentials>=1.0.0,<2.0.0",
    "codecraftai-dataprofiles>=1.0.0,<2.0.0",
    "codecraftai-networking>=1.0.0,<2.0.0",
    "codecraftai-interop>=1.0.0,<2.0.0",
    "codecraftai-integration-runtime>=1.0.0,<2.0.0",
    "codecraftai-landscaping>=1.0.0,<2.0.0",
    "codecraftai-xmodules>=1.0.0,<2.0.0",
]

[project.scripts]
testplus = "ccai.testplus.cli.testplus_command:testplus_root_command"

[project.urls]
Repository = "https://github.com/code-craft-ai-company/codecraftai-testplus"
Issues = "https://github.com/code-craft-ai-company/codecraftai-testplus/issues"

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
